<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글꽃초 테블릿 불편사항 접수</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* 삼성전자서비스처럼 깔끔한 서비스 접수 화면 스타일 */
    body {
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    .card {
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .title {
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #222;
      letter-spacing: -0.02em;
    }

    /* 입력창과 선택창 */
    .field input,
    .field select,
    .field textarea {
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: #222;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      background: #fff;
      box-sizing: border-box;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #2189ff;
      outline: 2px solid rgba(33, 137, 255, 0.12);
    }

    /* '선택'은 얇게 */
    select {
      font-weight: 400;
    }

    select option {
      font-weight: 400;
    }

    /* 안내용 placeholder도 얇게 */
    input::placeholder,
    textarea::placeholder {
      font-weight: 400;
      color: #888;
    }

    .btn-primary {
      font-weight: 700;
      border-radius: 6px;
    }

    /* 표 제목은 명확하게 */
    table th {
      font-weight: 700;
    }
  </style>

</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="title">글꽃초 테블릿 불편사항 접수</h1>

      <!-- 접수 폼 -->
      <form id="submit-form" class="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="grade">학년</label>
            <select id="grade" required>
              <option value="">선택</option>
              <option value="1학년">1학년</option>
              <option value="2학년">2학년</option>
              <option value="3학년">3학년</option>
              <option value="4학년">4학년</option>
              <option value="5학년">5학년</option>
              <option value="6학년">6학년</option>
            </select>
          </div>
          <div class="field">
            <label for="cls">반</label>
            <select id="cls" required>
              <option value="">선택</option>
              <option value="1반">1반</option>
              <option value="2반">2반</option>
              <option value="3반">3반</option>
              <option value="4반">4반</option>
              <option value="5반">5반</option>
              <option value="6반">6반</option>
              <option value="7반">7반</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="tablet">구글 계정 번호 (1~25)</label>
            <input id="tablet" type="text" placeholder="예) 01 또는 12_01 (1학년 2반 1번인 경우)">
          </div>
          <div class="field">
            <label for="reset-wish">공장 초기화 가능 여부</label>
            <select id="reset-wish" required>
              <option value="">선택</option>
              <option value="희망">희망</option>
              <option value="비희망">가능</option>
              <option value="비희망">불가능 (데이터/앱 삭제되면 안됨 )</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="detail">상세 장애 내용</label>
          <textarea id="detail" rows="3" placeholder="상세 장애 내용을 입력해 주세요(테블릿 특정 비밀번호가 있으면 꼭 기록해 주세요.)" required></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          <span class="btn-label">접수하기</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p id="submit-msg" class="msg" role="status" aria-live="polite" hidden></p>

      <!-- 조회 섹션 -->
      <section class="search-section">
        <div class="row search-row">
          <div class="field">
            <label for="search-grade">학년</label>
            <select id="search-grade">
              <option value="">전체</option>
              <option value="1학년">1학년</option>
              <option value="2학년">2학년</option>
              <option value="3학년">3학년</option>
              <option value="4학년">4학년</option>
              <option value="5학년">5학년</option>
              <option value="6학년">6학년</option>
            </select>
          </div>
          <div class="field">
            <label for="search-class">반</label>
            <select id="search-class">
              <option value="">전체</option>
              <option value="1반">1반</option>
              <option value="2반">2반</option>
              <option value="3반">3반</option>
              <option value="4반">4반</option>
              <option value="5반">5반</option>
              <option value="6반">6반</option>
              <option value="7반">7반</option>
            </select>
          </div>
          <button type="button" id="search-btn" class="btn btn-primary btn-search">
            <span class="btn-label">조회하기</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </div>

        <div id="results" class="results" hidden>
          <div class="table-wrap">
            <table>
              <colgroup>
                <col style="width:7%">
                <col style="width:7%">
                <col style="width:11%">
                <col style="width:11%">
                <col style="width:38%">
                <col style="width:11%">
                <col style="width:15%">
              </colgroup>
              <thead>
                <tr>
                  <th>학년</th>
                  <th>반</th>
                  <th>테블릿번호</th>
                  <th>공장초기화</th>
                  <th class="col-detail">상세장애내용</th>
                  <th>접수일</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
        </div>

        <p id="empty-msg" class="empty-msg" hidden>검색 결과가 없습니다.</p>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
